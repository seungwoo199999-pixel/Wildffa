# 일차는 마인크래프트 월드 시간 기준입니다. (24000틱 = 1일)
# 게임 시작 시 시간이 0으로 맞춰져 1일차 아침부터 시작합니다.
# 침대로 밤을 넘기면 일차도 같이 넘어갑니다.
days:
  end-open: 15      # 이 일차부터 엔드 입장 가능
  lives-limit: 20   # 이 일차부터 목숨 제한 시작
  deathmatch: 30    # 이 일차에 데스매치 시작

# 목숨 제한이 시작될 때 모두에게 주어지는 목숨 개수
lives: 3

border:
  size: 1000                       # 자기장 크기 (1000 = 1000 x 1000, 중심 0 0)
  random-teleport-on-start: true   # 시작할 때 자기장 안 무작위 위치로 텔레포트
  min-player-distance: 200         # 시작 위치끼리 최소 거리 (가능한 한 지킴)

end-portal:
  generate: true   # 게임 시작 시 0 0에 엔드 포탈 생성 (이미 직접 만들어뒀다면 false)

# 자연사(플레이어에게 죽은 게 아닌 사망: 낙사, 용암, 몹 등) 효과
natural-death:
  from-day: 1                  # 이 일차부터 적용 (20으로 바꾸면 목숨 제한 시작 후부터만 적용)
  keep-inventory: true         # 인벤토리/경험치 보존
  fire-resistance-seconds: 120 # 리스폰 후 화염 저항 시간
  freeze-seconds: 100          # 리스폰 후 움직일 수 없는 시간 (0이면 끔)

deathmatch:
  shrink-seconds: 600   # 자기장이 0 0까지 줄어드는 데 걸리는 시간(초)
  border-damage: 2.0    # 데스매치 중 자기장 밖 피해량
